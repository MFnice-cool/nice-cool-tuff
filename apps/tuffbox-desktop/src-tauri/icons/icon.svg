<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <!-- TuffBox — Inferno/Blaze/Solar. Full-bleed plate, transparent outside corners. -->
  <defs>
    <radialGradient id="plate" cx="36%" cy="26%" r="74%" fx="30%" fy="20%">
      <stop offset="0%" stop-color="#422014"/>
      <stop offset="38%" stop-color="#1e0c0a"/>
      <stop offset="72%" stop-color="#120606"/>
      <stop offset="100%" stop-color="#080202"/>
    </radialGradient>
    <radialGradient id="bloom" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#ffc500" stop-opacity="0.22"/>
      <stop offset="40%" stop-color="#ff5722" stop-opacity="0.08"/>
      <stop offset="75%" stop-color="#ff2d2d" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#ff2d2d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tBody" x1="50%" y1="12%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fffaf0"/>
      <stop offset="12%" stop-color="#ffd76a"/>
      <stop offset="32%" stop-color="#ffc500"/>
      <stop offset="58%" stop-color="#ff9a2e"/>
      <stop offset="82%" stop-color="#d97818"/>
      <stop offset="100%" stop-color="#8a4a10"/>
    </linearGradient>
    <radialGradient id="spark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffaf0" stop-opacity="1"/>
      <stop offset="45%" stop-color="#ffc500" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ff5722" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="redMote" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6b4a" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#ff2d2d" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff2d2d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tShade" x1="0%" y1="20%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#1a0a03" stop-opacity="0.45"/>
      <stop offset="48%" stop-color="#1a0a03" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffc500" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="tSpec" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fffaf0" stop-opacity="0.92"/>
      <stop offset="40%" stop-color="#ffc500" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffc500" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rim" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffb052" stop-opacity="0.5"/>
      <stop offset="45%" stop-color="#ff9a2e" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffc500" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="36"/>
    </filter>
    <filter id="emberBlur" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
    <filter id="letterShadow" x="-20%" y="-10%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="1.6" flood-color="#050000" flood-opacity="0.65"/>
    </filter>
    <filter id="sparkBlur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
    <clipPath id="plateClip">
      <rect x="8" y="8" width="496" height="496" rx="112" ry="112"/>
    </clipPath>
    <path id="tOutline" d="M -72 -86 L 72 -86 Q 86 -86 86 -72 L 86 -54 Q 86 -44 74 -44 L 24 -44 L 24 84 Q 24 96 12 96 L -12 96 Q -24 96 -24 84 L -24 -44 L -74 -44 Q -86 -44 -86 -54 L -86 -72 Q -86 -86 -72 -86 Z"/>
  </defs>
  <g clip-path="url(#plateClip)">
    <rect x="8" y="8" width="496" height="496" rx="112" ry="112" fill="url(#plate)"/>
    <ellipse cx="256" cy="236" rx="210" ry="210" fill="url(#bloom)" filter="url(#softGlow)" opacity="0.7"/>
    <ellipse cx="256" cy="200" rx="220" ry="160" fill="#ff9a2e" opacity="0.03" filter="url(#softGlow)"/>
    <g filter="url(#emberBlur)" opacity="0.85">
      <circle cx="92" cy="118" r="2.6" fill="#ffc500"/>
      <circle cx="420" cy="148" r="2.0" fill="#ff9a2e"/>
      <circle cx="388" cy="408" r="2.4" fill="#ffb052"/>
      <circle cx="110" cy="418" r="1.8" fill="#ffc500" opacity="0.7"/>
      <circle cx="430" cy="300" r="1.6" fill="#ff8a00"/>
      <circle cx="70" cy="280" r="2.0" fill="#ff9a2e" opacity="0.65"/>
      <circle cx="310" cy="78" r="1.6" fill="#fff1c2" opacity="0.5"/>
    </g>
    <g transform="translate(256 252) scale(1.72)">
      <g filter="url(#sparkBlur)">
        <circle cx="-96" cy="-70" r="2.2" fill="url(#spark)"/>
        <circle cx="-88" cy="-48" r="1.1" fill="url(#redMote)"/>
        <circle cx="94" cy="-66" r="1.8" fill="url(#spark)"/>
        <circle cx="102" cy="-42" r="1.2" fill="url(#redMote)"/>
        <circle cx="48" cy="-108" r="1.0" fill="url(#spark)" opacity="0.7"/>
        <circle cx="-40" cy="-110" r="0.9" fill="#ffc500" opacity="0.55"/>
        <circle cx="-42" cy="78" r="1.6" fill="url(#redMote)"/>
        <circle cx="44" cy="70" r="1.3" fill="url(#spark)" opacity="0.75"/>
        <circle cx="8" cy="118" r="1.1" fill="url(#redMote)" opacity="0.7"/>
        <circle cx="-108" cy="8" r="1.4" fill="url(#spark)" opacity="0.65"/>
        <circle cx="112" cy="18" r="1.0" fill="#ff5722" opacity="0.45"/>
        <path d="M -98 -28 L -92 -22" stroke="#ff5722" stroke-opacity="0.45" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M 96 -24 L 102 -18" stroke="#ffc500" stroke-opacity="0.4" stroke-width="1.4" stroke-linecap="round"/>
        <path d="M -36 108 L -30 114" stroke="#ff2d2d" stroke-opacity="0.35" stroke-width="1.3" stroke-linecap="round"/>
      </g>
      <g filter="url(#letterShadow)">
        <use href="#tOutline" fill="url(#tBody)"/>
        <use href="#tOutline" fill="url(#tShade)"/>
        <path d="M -72 -86 L 72 -86 Q 86 -86 86 -72 L 86 -60 L -86 -60 L -86 -72 Q -86 -86 -72 -86 Z" fill="url(#tSpec)"/>
        <path d="M -66 -44 L 66 -44" stroke="#ffc500" stroke-opacity="0.22" stroke-width="1.4" stroke-linecap="round"/>
      </g>
    </g>
    <rect x="14" y="14" width="484" height="484" rx="106" ry="106" fill="none" stroke="url(#rim)" stroke-width="3" opacity="0.8"/>
  </g>
</svg>
