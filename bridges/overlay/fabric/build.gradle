plugins {
    id "fabric-loom" version "1.7-SNAPSHOT"
}

base {
    archivesName = "tuffbox-overlay-1.21.1-fabric"
}

repositories {
    maven { url = "https://api.modrinth.com/maven" }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    implementation project(":core")

    // WATERMeDIA API surface — production runtime provides it via launcher inject;
    // dev runs (runClient) pull it from Modrinth maven.
    modCompileOnly "maven.modrinth:watermedia:${watermedia_version}"
    modRuntimeOnly "maven.modrinth:watermedia:${watermedia_version}"
}

sourceSets.main.java.srcDir("../common/src/main/java")

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

// Bundle the Java-8 core protocol module (no Minecraft refs, nothing to remap).
tasks.named("jar", Jar).configure {
    from(project(":core").sourceSets.main.output)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
