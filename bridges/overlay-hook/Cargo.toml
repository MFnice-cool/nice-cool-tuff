# tuffbox_overlay_hook - OpenGL present-hook overlay for Minecraft

[package]
name = "tuffbox-overlay-hook"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "tuffbox_overlay_hook"
crate-type = ["cdylib"]

[dependencies]
once_cell = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
parking_lot = "0.12"
lru = "0.12"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_OpenGL",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_SystemServices",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
# Note: ClientToScreen / WindowFromDC come from Win32_UI_WindowsAndMessaging + Win32_Graphics_Gdi.
minhook = "0.8"
libloading = "0.8"
